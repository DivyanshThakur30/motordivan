/* Logo v2: icon mark + friendly two-tone wordmark */
.logo,.footer-brand{display:flex;align-items:center;gap:9px;font-family:'Plus Jakarta Sans','Rajdhani',sans-serif;letter-spacing:0;line-height:1}
.logo-mark{width:34px;height:34px;flex:0 0 auto;box-shadow:0 4px 12px rgba(230,57,70,.4);border-radius:11px;transition:transform .25s}
.logo:hover .logo-mark,.footer-brand:hover .logo-mark{transform:rotate(-6deg) scale(1.06)}
.lg-w{font-size:max(.78em,.95rem);font-weight:800;white-space:nowrap}
.lg-a,.lg-b{font-style:normal;font-weight:800;letter-spacing:-.025em}
.lg-a{color:#fff}.lg-b{color:var(--gold,#FFB703)}
@media(max-width:480px){.logo-mark{width:30px;height:30px}.logo{gap:7px}}
